<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConTeXt PDF</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <header id="toolbar">
    <div class="toolbar-group" id="navGroup">
      <button type="button" id="btnPrev" title="Previous page" aria-label="Previous page">Prev</button>
      <input
        type="text"
        id="pageInput"
        value="1"
        inputmode="numeric"
        autocomplete="off"
        title="Page (Enter to jump)"
        aria-label="Page number"
      />
      <span id="pageTotal">/ 0</span>
      <button type="button" id="btnNext" title="Next page" aria-label="Next page">Next</button>
    </div>
    <div class="toolbar-group" id="zoomGroup">
      <button type="button" id="btnZoomOut" title="Zoom out (Shift+wheel)" aria-label="Zoom out">-</button>
      <input
        type="text"
        id="zoomInput"
        value="125%"
        inputmode="decimal"
        title="Zoom percent (Enter to apply; Shift+wheel)"
        aria-label="Zoom percent"
      />
      <button type="button" id="btnZoomIn" title="Zoom in (Shift+wheel)" aria-label="Zoom in">+</button>
      <button type="button" id="btnFitWidth" title="Fit width" aria-label="Fit width">Fit</button>
    </div>
    <div class="toolbar-group" id="statusGroup">
      <span id="statusText">No PDF</span>
    </div>
  </header>
  <main id="viewer" tabindex="0"></main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
